[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vulnconsole"
version = "0.0.1"
description = "Codebase Vulnerability Triage and Remediation Console"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "fastapi>=0.115",
  "python-multipart>=0.0.9",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5",
  "sqlalchemy[asyncio]>=2.0.36",
  "alembic>=1.13",
  "asyncpg>=0.29",
  "nats-py>=2.9",
  "redis>=5.0",
  "opensearch-py>=2.6",
  "minio>=7.2",
  "httpx>=0.27",
  "structlog>=24.4",
  "pyjwt>=2.9",
  "pwdlib[argon2]>=0.2",
  "uuid-utils>=0.9",
]

[project.optional-dependencies]
dev = [
  # Pinned so local, Docker, and CI lint and type-check identically (rule sets
  # shift between releases). Bump deliberately, not implicitly.
  "ruff==0.15.20",
  "mypy==2.1.0",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "import-linter>=2.0",
]

# Scanner connectors are discovered through this entry-point group (ADR-0008).
# Built-in connectors register here starting in Milestone 1.
[project.entry-points."vulnconsole.connectors"]

[tool.hatch.build.targets.wheel]
packages = ["src/vulnconsole"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests assert and use throwaway credentials by nature.
"tests/**" = ["S101", "S105", "S106"]
# SQLAlchemy declarative attributes (__table_args__) are class-level by API design.
"**/domain/models.py" = ["RUF012"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["vulnconsole"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--strict-markers"

# Context boundaries (ADR-0002): domain and infrastructure layers are private
# to their context. Run with: lint-imports (or python -m importlinter.cli lint)
[tool.importlinter]
root_package = "vulnconsole"

[[tool.importlinter.contracts]]
name = "identity domain and infrastructure are private"
type = "forbidden"
source_modules = [
  "vulnconsole.contexts.ingestion",
  "vulnconsole.contexts.normalization",
]
allow_indirect_imports = true
forbidden_modules = [
  "vulnconsole.contexts.identity.domain",
  "vulnconsole.contexts.identity.infrastructure",
]

[[tool.importlinter.contracts]]
name = "ingestion domain and infrastructure are private"
type = "forbidden"
source_modules = [
  "vulnconsole.contexts.identity",
  "vulnconsole.contexts.normalization",
]
allow_indirect_imports = true
forbidden_modules = [
  "vulnconsole.contexts.ingestion.domain",
  "vulnconsole.contexts.ingestion.infrastructure",
]

[[tool.importlinter.contracts]]
name = "normalization domain and infrastructure are private"
type = "forbidden"
source_modules = [
  "vulnconsole.contexts.identity",
  "vulnconsole.contexts.ingestion",
]
allow_indirect_imports = true
forbidden_modules = [
  "vulnconsole.contexts.normalization.domain",
  "vulnconsole.contexts.normalization.infrastructure",
]

[[tool.importlinter.contracts]]
name = "shared kernel does not depend on contexts or platform"
type = "forbidden"
source_modules = ["vulnconsole.shared"]
forbidden_modules = ["vulnconsole.contexts", "vulnconsole.platform"]
