<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Triage, prioritize, and remediate security findings across your estate."
    />
    <meta name="color-scheme" content="dark light" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%230b363b'/%3E%3Cpath d='M8 3.1 11.7 4.4v2.9c0 2.3-1.55 4.3-3.7 4.9-2.15-.6-3.7-2.6-3.7-4.9V4.4L8 3.1Z' fill='none' stroke='%23abffae' stroke-width='1.1' stroke-linejoin='round'/%3E%3Cpath d='M6.6 7.5 7.65 8.6 9.75 6.5' fill='none' stroke='%23abffae' stroke-width='1.1' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <title>Vulnerability Console</title>
    <script>
      // Apply the stored theme before first paint so reloads never flash the
      // opposite theme. App.tsx reads the same key and stays in sync.
      (function () {
        try {
          var stored = localStorage.getItem("vc_theme");
          document.documentElement.dataset.theme =
            stored === "light" || stored === "dark" ? stored : "dark";
        } catch (err) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
