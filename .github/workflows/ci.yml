# CI: structural checks, backend lint + tests, frontend typecheck + build.
# mypy is advisory here because the dev machine cannot run it at all
# (App Control blocks its native core); tighten to blocking once triaged.

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typography:
    name: No em or en dashes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Grep for U+2013 and U+2014
        run: |
          if grep -rInP '[\x{2013}\x{2014}]' --exclude-dir=.git --exclude-dir=node_modules .; then
            echo "Found em or en dashes; use colons, commas, or hyphens instead."
            exit 1
          fi

  compose-validate:
    name: Compose config validates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker compose config
        run: docker compose -f deploy/compose/docker-compose.yml config --quiet

  backend:
    name: Backend lint + unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e '.[dev]'
      - name: Ruff
        run: ruff check .
      - name: Unit tests
        run: pytest tests/unit -q

  backend-typecheck:
    name: mypy (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e '.[dev]'
      - name: mypy
        run: mypy src/vulnconsole

  frontend:
    name: Frontend typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
